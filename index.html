<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Time Capsule 2050</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one 16:9 stage scaled to the projector, ruler-like probability scale as the recurring motif,
   header strip shows which lesson pillars (paper, TPR, digital, lexical) are active on the slide. */
:root{
  --ground:#BFC8D0;      /* letterbox */
  --sheet:#F4F6F7;       /* stage */
  --ink:#111B26;
  --ink-2:#4B5A68;
  --line:#B7C1CA;
  --signal:#2B3BFF;      /* capsule blue */
  --signal-bg:#E3E6FF;
  --ok:#14724A; --ok-bg:#D6EFE3;
  --part:#8A5C00; --part-bg:#F5E5BE;
  --no:#B02A22; --no-bg:#F7D9D6;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:.3cqw solid var(--signal);outline-offset:.2cqw}
#stage{position:relative;container-type:size;background:var(--sheet);display:grid;grid-template-rows:auto 1fr auto;padding:0 3cqw;overflow:hidden;box-shadow:0 1cqw 4cqw rgba(17,27,38,.25)}

/* header */
.top{display:flex;align-items:center;gap:2cqw;padding:1.5cqw 0;border-bottom:1px solid var(--line)}
.phase{font:600 1.15cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;flex:1;white-space:nowrap}
.phase em{font-style:normal;color:var(--signal)}
.pillars{display:flex;gap:.6cqw}
.chip{font:500 .95cqw var(--mono);letter-spacing:.1em;padding:.35cqw .9cqw;border:1px solid var(--line);border-radius:9cqw;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.count{font:500 1.15cqw var(--mono);color:var(--ink-2);min-width:7cqw;text-align:right}

/* main */
#main{padding:2cqw 0 1.6cqw;display:flex;flex-direction:column;gap:1.6cqw;min-height:0;overflow:hidden}
.eyebrow{font:600 1.15cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.h1{font:700 4cqw/1.08 var(--display);letter-spacing:-.015em;text-wrap:balance}
.h2{font:700 2.6cqw/1.15 var(--display);letter-spacing:-.01em;text-wrap:balance}
.lead{font-size:1.9cqw;line-height:1.45;max-width:62cqw;color:var(--ink)}
.dim{color:var(--ink-2)}
.mono{font-family:var(--mono)}
.row{display:flex;gap:2cqw}
.grow{flex:1;min-width:0}

/* title */
.title{display:grid;grid-template-columns:1.1fr .9fr;gap:3cqw;align-items:center;height:100%}
.title .h1{font-size:6.4cqw;line-height:1}
.title .h1 span{color:var(--signal)}
.goals{margin-top:2.4cqw;display:grid;gap:.9cqw;font-size:1.8cqw}
.goals li{list-style:none;display:grid;grid-template-columns:3cqw 1fr;align-items:baseline}
.goals b{font:600 1.2cqw var(--mono);color:var(--signal)}
.capsule{width:100%;height:auto}
.capsule .lid{animation:close 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes close{from{transform:translateX(7%)}to{transform:none}}

/* plan */
.plan{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;margin-top:.8cqw}
.pc{border-top:.5cqw solid var(--ink);padding-top:1.1cqw;display:flex;flex-direction:column;gap:.7cqw}
.pc .m{font:600 1.25cqw var(--mono);color:var(--signal)}
.pc h3{font:700 2cqw/1.15 var(--display)}
.pc p{font-size:1.6cqw;line-height:1.4;color:var(--ink-2)}
.pc .chips{display:flex;flex-wrap:wrap;gap:.4cqw;margin-top:auto}
.pc .chips span{font:500 .85cqw var(--mono);letter-spacing:.08em;border:1px solid var(--line);padding:.25cqw .6cqw;border-radius:9cqw}

/* verbs */
.verbs{display:grid;grid-template-columns:repeat(4,1fr);gap:1.2cqw;flex:1;min-height:0}
.vc{border:1px solid var(--line);background:#fff;padding:1.3cqw 1.4cqw;display:flex;flex-direction:column;gap:.6cqw;transition:border-color .15s,background .15s}
.vc .n{font:600 1cqw var(--mono);color:var(--ink-2)}
.vc h3{font:700 2.3cqw var(--display);letter-spacing:-.01em}
.vc .ch{font-size:1.55cqw;line-height:1.3}
.vc .g{margin-top:auto;font:500 1.1cqw/1.35 var(--mono);color:var(--ink-2)}
.vc.hi{border-color:var(--signal);background:var(--signal-bg);box-shadow:inset 0 0 0 .22cqw var(--signal)}
.vc.hi .g{color:var(--ink)}

/* oracle game */
.game{flex:1;display:grid;place-items:center;text-align:center;position:relative}
.game .say{font:600 1.6cqw var(--mono);letter-spacing:.2em;color:var(--ink-2);text-transform:uppercase}
.game .word{font:800 11cqw/1 var(--display);letter-spacing:-.03em;margin:1.2cqw 0 1.4cqw}
.game .chunk{font-size:3cqw;font-weight:500}
.game .gest{margin-top:1.6cqw;font:500 1.45cqw var(--mono);color:var(--ink-2)}
.game .mark{position:absolute;right:0;bottom:0;font:500 1cqw var(--mono);color:#9AA7B3}

/* scale */
.scale{display:grid;grid-template-columns:repeat(7,1fr);gap:.5cqw}
.pt{border-top:.5cqw solid var(--ink);padding:.9cqw .8cqw 1cqw;display:flex;flex-direction:column;gap:.35cqw;min-height:9cqw;position:relative;transition:background .2s}
.pt::before{content:"";position:absolute;left:0;top:-1.3cqw;width:.18cqw;height:.8cqw;background:var(--ink)}
.pt .n{font:600 1cqw var(--mono);color:var(--ink-2)}
.pt b{font:700 1.45cqw/1.15 var(--display);letter-spacing:-.01em}
.pt i{font-style:normal;font-size:1.05cqw;line-height:1.3;color:var(--ink-2)}
.pt.in{background:var(--ok-bg);border-top-color:var(--ok)}
.pt.in.partly{background:var(--part-bg);border-top-color:var(--part)}
.pt.in.false{background:var(--no-bg);border-top-color:var(--no)}
.scale.big .pt{min-height:13cqw}
.scale.big .pt b{font-size:1.7cqw}
.scale.big .pt i{font-size:1.25cqw}
.ends{display:flex;justify-content:space-between;font:500 1cqw var(--mono);color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}

/* rounds */
.claim{font:700 3.3cqw/1.15 var(--display);letter-spacing:-.015em;text-wrap:balance;max-width:80cqw}
.cue{display:flex;align-items:center;gap:1.4cqw;min-height:9.5cqw;font-size:1.8cqw;line-height:1.4}
.cue .steps{display:flex;gap:2.4cqw}
.cue .steps div{display:flex;gap:.7cqw;align-items:baseline}
.cue .steps b{font:600 1.2cqw var(--mono);color:var(--signal)}
.badge{font:700 1.7cqw var(--display);padding:1cqw 1.6cqw;white-space:nowrap}
.badge.true{background:var(--ok);color:#fff}
.badge.partly{background:var(--part);color:#fff}
.badge.false{background:var(--no);color:#fff}
.fact{font-size:1.75cqw;line-height:1.4;max-width:56cqw}
.fact small{display:block;margin-top:.5cqw;font:500 1cqw var(--mono);color:var(--ink-2)}
.paperpill{font:600 1.05cqw var(--mono);letter-spacing:.1em;border:1px dashed var(--ink-2);padding:.5cqw 1cqw;white-space:nowrap}

/* fold */
.fold{display:grid;grid-template-columns:36cqw 1fr;gap:3cqw;flex:1;min-height:0}
.fold svg{width:100%;height:auto;background:#fff;border:1px solid var(--line)}
.f-line{stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
.f-dash{stroke:var(--signal);fill:none;stroke-width:2;stroke-dasharray:7 6}
.f-fill{fill:#E9EEF2;stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.f-fill2{fill:var(--signal-bg);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.f-txt{font:600 12px var(--mono);fill:var(--ink);text-anchor:middle;dominant-baseline:middle}
.f-lab{font:500 13px var(--mono);fill:var(--signal);text-anchor:middle}
.fsteps{display:flex;flex-direction:column;gap:.5cqw}
.fs{display:grid;grid-template-columns:3.4cqw 1fr;gap:1cqw;padding:.9cqw 1cqw;border-left:.35cqw solid var(--line);text-align:left;opacity:.5}
.fs .n{font:700 1.9cqw var(--display);color:var(--ink-2)}
.fs h3{font:700 1.6cqw var(--display)}
.fs p{font-size:1.4cqw;line-height:1.4;margin-top:.4cqw;display:none}
.fs .w{display:none;margin-top:.7cqw;font:600 1.25cqw/1.35 var(--mono);background:var(--signal);color:#fff;padding:.6cqw .9cqw}
.fs.on{opacity:1;border-left-color:var(--signal);background:#fff}
.fs.on p,.fs.on .w{display:block}
.fs.on .n{color:var(--signal)}

/* chunks */
.bank{display:grid;grid-template-columns:1fr 1fr;gap:.9cqw 2cqw;flex:1;min-height:0;align-content:start}
.st{display:grid;grid-template-columns:3cqw 1fr;gap:.6cqw;align-items:baseline;border-top:1px solid var(--ink);padding-top:.8cqw}
.st .n{font:700 1.5cqw var(--display);color:var(--signal)}
.st .t{font-size:2cqw;line-height:1.25;font-weight:500}
.st .g{grid-column:2;font:500 1cqw var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.topics{display:flex;gap:1cqw}
.topics span{font:700 1.7cqw var(--display);border:.25cqw solid var(--ink);padding:.7cqw 1.4cqw}

/* play */
.cols{display:grid;grid-template-columns:1.1fr .9fr;gap:3cqw;flex:1;min-height:0}
.olist{display:flex;flex-direction:column;gap:1.1cqw;counter-reset:o}
.olist div{display:grid;grid-template-columns:3cqw 1fr;gap:.6cqw;font-size:1.75cqw;line-height:1.35;border-top:1px solid var(--line);padding-top:.9cqw}
.olist b{font:600 1.2cqw var(--mono);color:var(--signal);padding-top:.35cqw}
.rx{display:flex;flex-direction:column;gap:1.4cqw}
.rx h4{font:600 1.05cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;margin-bottom:.5cqw}
.rx.ag h4{color:var(--ok)} .rx.dg h4{color:var(--no)} .rx.cl h4{color:var(--signal)}
.rx p{font-size:1.6cqw;line-height:1.4}

/* court */
.court{display:grid;grid-template-columns:1.05fr .95fr;gap:3cqw;flex:1;min-height:0}
.pick{border:1px solid var(--ink);background:#fff;padding:1.6cqw;display:flex;flex-direction:column;gap:1.1cqw}
.pick .nm{font:800 5cqw/1 var(--display);letter-spacing:-.02em;min-height:5.4cqw}
.pick label{font:600 1cqw var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pick input[type=text]{font:500 1.7cqw var(--body);padding:.9cqw 1cqw;border:1px solid var(--ink);background:var(--sheet);width:100%}
.pos{display:grid;grid-template-columns:repeat(7,1fr);gap:.4cqw}
.pos button{border:1px solid var(--ink);padding:.7cqw .2cqw;font:600 1.1cqw var(--mono);background:#fff}
.pos button.on{background:var(--ink);color:#fff}
.btn{background:var(--signal);color:#fff;font:700 1.35cqw var(--display);padding:1cqw 1.4cqw;align-self:flex-start}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
.caps{display:flex;flex-direction:column;gap:.7cqw;overflow:auto;min-height:0}
.slip{background:#fff;border:1px solid var(--line);border-left:.5cqw solid var(--c,var(--ink));padding:.8cqw 1.1cqw;font-size:1.45cqw;line-height:1.35}
.slip small{display:block;font:500 .95cqw var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:.3cqw}
.empty{border:1px dashed var(--ink-2);padding:1.6cqw;color:var(--ink-2);font-size:1.5cqw}

/* sealed */
.sealed{display:grid;grid-template-columns:.9fr 1.1fr;gap:3cqw;flex:1;min-height:0;align-items:center}
.days{font:800 9cqw/1 var(--display);letter-spacing:-.03em;color:var(--signal)}
.rank{display:flex;flex-direction:column;gap:.5cqw;margin-top:1.4cqw}
.rank div{display:flex;gap:1cqw;align-items:center;font-size:1.6cqw}
.rank i{width:1.2cqw;height:1.2cqw;background:var(--c)}
.rank b{font:700 1.6cqw var(--mono);margin-left:auto}

/* footer */
.bot{display:flex;align-items:center;gap:2cqw;padding:1.1cqw 0;border-top:1px solid var(--line)}
#teams{display:flex;gap:.7cqw}
.team{display:flex;align-items:center;gap:.7cqw;padding:.5cqw 1cqw;border:1px solid var(--line);font:600 1.15cqw var(--mono);background:#fff}
.team i{width:.9cqw;height:.9cqw;background:var(--c)}
.team b{font-size:1.5cqw;min-width:1.4cqw;text-align:right}
.keys{flex:1;text-align:center;font:500 .95cqw var(--mono);color:var(--ink-2);letter-spacing:.04em}
#timer{display:flex;align-items:center;gap:1cqw;font:600 2.3cqw var(--mono);min-width:19cqw;justify-content:flex-end;position:relative;padding-bottom:.5cqw}
#timer button{font:600 1cqw var(--mono);border:1px solid var(--ink);padding:.4cqw .8cqw}
#tbar{position:absolute;left:0;right:0;bottom:0;height:.3cqw;background:var(--line)}
#tbar i{display:block;height:100%;width:0;background:var(--signal)}
#timer.done{color:var(--no);animation:flash .6s steps(2) 6}
@keyframes flash{50%{opacity:.15}}

/* notes */
#notes{position:absolute;top:0;right:0;bottom:0;width:34cqw;background:var(--ink);color:#E6ECF1;padding:2cqw;font-size:1.3cqw;line-height:1.5;overflow:auto;transform:translateX(102%);transition:transform .2s}
#notes.open{transform:none}
#notes h5{font:600 1cqw var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9FB0FF;margin-bottom:1cqw}
#notes p{margin-bottom:1cqw}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <header class="top">
    <div class="phase" id="phase"></div>
    <div class="pillars" id="pillars"></div>
    <div class="count" id="count"></div>
  </header>
  <main id="main"></main>
  <footer class="bot">
    <div id="teams"></div>
    <div class="keys">← → slides · Space next · T timer · N notes · F full</div>
    <div id="timer"><span id="tt">--:--</span><button id="tbtn" type="button">START</button><div id="tbar"><i></i></div></div>
  </footer>
  <aside id="notes" aria-label="Teacher notes"></aside>
</div>

<script>
'use strict';
/* ---------- data ---------- */
const TEAMS=[{n:'Orbit',c:'#2B3BFF'},{n:'Pixel',c:'#C2188B'},{n:'Nova',c:'#00838F'},{n:'Echo',c:'#6A3FB5'}];
const SCALE=[
 {k:'no chance',c:'There’s no chance that…'},
 {k:'highly unlikely',c:'It’s highly unlikely that…'},
 {k:'unlikely',c:'I doubt that… / It’s unlikely that…'},
 {k:'possible',c:'It might well… / There’s a possibility of…'},
 {k:'likely',c:'It’s likely that… / …will probably…'},
 {k:'highly likely',c:'It’s highly likely that… / In all likelihood, …'},
 {k:'certain',c:'…will undoubtedly… / There’s no doubt that…'}
];
const VERBS=[
 {v:'predict',c:'predict a sharp rise in…',g:'Hands circle in front of you, like a crystal ball.'},
 {v:'replace',c:'replace human workers with…',g:'One hand pushes the other aside and takes its place.'},
 {v:'automate',c:'automate routine tasks',g:'Forearms rotate like gears.'},
 {v:'boost',c:'boost productivity',g:'Both hands sweep up from the knees to above the head.'},
 {v:'cut',c:'cut jobs',g:'Two fingers snip like scissors.'},
 {v:'adapt',c:'adapt to new technology',g:'Shift your whole body into a new pose.'},
 {v:'threaten',c:'threaten traditional jobs',g:'Point a finger forward and frown.'},
 {v:'benefit',c:'benefit from automation',g:'Cup both hands open and pull them to your chest.'}
];
const ROUNDS=[
 {src:'Ladies’ Home Journal · 1900 · about the year 2000',claim:'News photographs will be sent across the world and printed in newspapers within an hour of an event.',v:'true',label:'CAME TRUE',fact:'Wire-photo services sent news pictures between cities from the 1920s. Today a photo crosses the planet in seconds.',ref:'J. E. Watkins Jr., “What May Happen in the Next Hundred Years”, Dec 1900; BBC News, 2012'},
 {src:'Ladies’ Home Journal · 1900 · about the year 2000',claim:'The letters C, X and Q will disappear from the everyday alphabet.',v:'false',label:'DID NOT HAPPEN',fact:'All three letters are still in everyday use.',ref:'J. E. Watkins Jr., Dec 1900; Saturday Evening Post / NPR, 2012'},
 {src:'Isaac Asimov, New York Times · 1964 · about 2014',claim:'Phone calls will let you see as well as hear the person you are talking to.',v:'true',label:'CAME TRUE',fact:'Video calls are routine on phones and laptops.',ref:'I. Asimov, “Visit to the World’s Fair of 2014”, New York Times, 16 Aug 1964'},
 {src:'John Maynard Keynes · 1930 · about 2030',claim:'Technology will cut the working week to about 15 hours.',v:'false',label:'NOT HAPPENING',fact:'The wealth came, but the 15-hour week did not. Full-time work is still about 40 hours a week in most countries.',ref:'J. M. Keynes, “Economic Possibilities for our Grandchildren”, 1930'},
 {src:'Back to the Future Part II · 1989 · about 2015',claim:'Shoes will tie their own laces.',v:'partly',label:'PARTLY TRUE',fact:'Nike made 89 pairs of self-lacing Mag shoes in 2016. The first widely sold self-lacing shoe, the Adapt BB, arrived in 2019.',ref:'Nike product releases 2016 and 2019 (Sotheby’s lot notes; press coverage, Feb 2019)'},
 {src:'Back to the Future Part II · 1989 · about 2015',claim:'Flying cars will be part of everyday traffic.',v:'false',label:'NOT YET',fact:'Prototypes and air-taxi trials exist, but flying cars are not part of everyday traffic.',ref:'Film premise, 1989'}
];
const ZONE={true:[4,6],partly:[3,4],false:[0,2]};
const STEMS=[
 ['By 2050, … will have …','future perfect'],
 ['This time in 2040, we’ll be …ing','future continuous'],
 ['In all likelihood, …','hedge'],
 ['It’s highly unlikely that …','intensifier'],
 ['There will be a huge demand for …','noun + preposition'],
 ['Our dependence on … will …','noun + preposition'],
 ['There’s a strong possibility of …ing','noun + preposition'],
 ['I’m firmly convinced that …','intensifier']
];
const TOPICS=['WORK','TRANSPORT','HOME','HEALTH'];
const FOLD=[
 {t:'Make a square',d:'Fold one corner of an A4 sheet to the opposite long edge. Cut off the strip. Unfold.'},
 {t:'Find the centre',d:'Fold the square in half diagonally both ways, then unfold. The creases cross at the centre.'},
 {t:'Corners in',d:'Fold all four corners to the centre.',w:'WRITE a topic on each triangle: WORK · TRANSPORT · HOME · HEALTH'},
 {t:'Flip it',d:'Turn the paper over. The plain side is up.'},
 {t:'Corners in, again',d:'Fold the four corners to the centre again. Fold in half both ways, then unfold.',w:'WRITE 1–8 on the eight small triangles. Lift each one and write a chunk stem under it.'},
 {t:'Pop it',d:'Topics outside. Slide thumbs and index fingers into the four pockets and pinch.'}
];

/* ---------- state ---------- */
const KEY='timecapsule-2050';
let S={i:0,scores:[0,0,0,0],capsule:[],used:[],cur:null,draft:'',pos:3,cmd:null,cmdN:0};
let sub=0;
try{const raw=localStorage.getItem(KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o.i==='number')S=Object.assign(S,o)}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);

/* ---------- components ---------- */
function scaleHTML(zone,tone,big){
  return `<div><div class="scale${big?' big':''}">${SCALE.map((p,i)=>`<div class="pt${zone&&i>=zone[0]&&i<=zone[1]?' in '+tone:''}"><span class="n">${i}</span><b>${p.k}</b><i>${p.c}</i></div>`).join('')}</div>
  <div class="ends" style="margin-top:.8cqw"><span>← it will not happen</span><span>it will happen →</span></div></div>`;
}
function foldSVG(n){
  const L=(c,x)=>`<text class="f-txt" ${x}>${c}</text>`;
  let b='';
  if(n===0){
    b=`<rect class="f-fill" x="30" y="72" width="240" height="160"/><path class="f-dash" d="M190 72 L30 232"/><path class="f-dash" d="M190 72 V232"/>
    <text class="f-lab" x="230" y="158">cut</text><text class="f-lab" x="110" y="50">fold corner to long edge</text>`;
  }else if(n===1){
    b=`<rect class="f-fill" x="60" y="60" width="180" height="180"/><path class="f-dash" d="M60 60 L240 240 M240 60 L60 240"/><circle cx="150" cy="150" r="5" fill="var(--signal)"/><text class="f-lab" x="150" y="270">creases cross at the centre</text>`;
  }else if(n===2){
    b=`<polygon class="f-fill" points="150,60 240,150 150,240 60,150"/><path class="f-line" d="M150 60 V240 M60 150 H240"/>

/* ---------- engine ---------- */
function drawTeams(){
  $('#teams').innerHTML=TEAMS.map((t,i)=>`<button type="button" class="team" style="--c:${t.c}" data-a="score" data-n="${i}" title="Click +1, Shift+click −1"><i></i>${t.n}<b>${S.scores[i]}</b></button>`).join('');
}
function render(){
  const s=SL[S.i];
  $('#phase').innerHTML=`<em>${String(S.i+1).padStart(2,'0')}</em> · ${esc(s.phase)}${s.min?` · ${esc(s.min)}`:''}`;
  $('#pillars').innerHTML=Object.keys(P).map(k=>`<span class="chip${s.pill.includes(k)?' on':''}">${P[k]}</span>`).join('');
  $('#count').textContent=`${S.i+1} / ${SL.length}`;
  $('#main').innerHTML=s.render();
  $('#notes').innerHTML=`<h5>Teacher notes · ${esc(s.phase)}</h5>${s.notes}`;
  drawTeams();save();
}
function go(d){
  const n=Math.min(SL.length-1,Math.max(0,S.i+d));
  if(n===S.i)return;
  S.i=n;sub=0;setTimer(SL[n].secs||0);render();
}
function act(){
  const s=SL[S.i];
  if(s.id==='game'){newCmd();return}
  if(s.id==='court'){pickTeam();return}
  if(s.max!==undefined){ if(sub<s.max){sub++;render();return} }
  go(1);
}
function newCmd(){
  let v;do{v=Math.floor(Math.random()*VERBS.length)}while(S.cmd&&v===S.cmd.v);
  S.cmd={v,says:Math.random()>.3};S.cmdN++;render();
}
function pickTeam(){
  if(S.used.length>=TEAMS.length)S.used=[];
  const left=TEAMS.map((t,i)=>i).filter(i=>!S.used.includes(i));
  const el=$('#pickName');let n=0;
  const iv=setInterval(()=>{if(el){const t=TEAMS[left[n%left.length]];el.textContent=t.n;el.style.color=t.c}n++},70);
  setTimeout(()=>{clearInterval(iv);S.cur=left[Math.floor(Math.random()*left.length)];S.used.push(S.cur);render()},650);
}
function addCapsule(){
  const inp=$('#draft');const text=(inp?inp.value:S.draft).trim();
  if(!text)return;
  const t=S.cur!=null?TEAMS[S.cur]:{n:'Class',c:'#111B26'};
  S.capsule.push({team:t.n,c:t.c,text,pos:S.pos});S.draft='';S.cur=null;render();
}
function score(i,d){S.scores[i]=Math.max(0,S.scores[i]+d);drawTeams();save()}

/* timer */
const T={total:0,left:0,end:0,run:false};
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function drawTimer(){
  $('#tt').textContent=T.total?fmt(T.left):'--:--';
  $('#tbtn').textContent=T.run?'PAUSE':'START';
  $('#tbar i').style.width=T.total?(100*(T.total-T.left)/T.total)+'%':'0';
  $('#timer').classList.toggle('done',T.total>0&&T.left===0&&!T.run);
}
function setTimer(sec){T.total=sec;T.left=sec;T.run=false;drawTimer()}
function toggleTimer(){
  if(!T.total)return;
  if(T.run){T.left=Math.max(0,Math.round((T.end-Date.now())/1000));T.run=false}
  else{if(T.left<=0)T.left=T.total;T.end=Date.now()+T.left*1000;T.run=true}
  drawTimer();
}
setInterval(()=>{
  if(!T.run)return;
  const l=Math.max(0,Math.round((T.end-Date.now())/1000));
  if(l!==T.left){T.left=l;if(l===0){T.run=false;ding()}drawTimer()}
},200);
function ding(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.35)}catch(e){}}

/* stage fit */
function fit(){
  const w=innerWidth,h=innerHeight;let sw,sh;
  if(w/h>16/9){sh=h;sw=h*16/9}else{sw=w;sh=w*9/16}
  const st=$('#stage');st.style.width=sw+'px';st.style.height=sh+'px';
}
function fs(){try{const d=document;if(d.fullscreenElement){d.exitFullscreen()}else{d.documentElement.requestFullscreen()}}catch(e){}}

/* events */
addEventListener('resize',fit);
$('#tbtn').addEventListener('click',toggleTimer);
$('#main').addEventListener('input',e=>{if(e.target.id==='draft'){S.draft=e.target.value;save()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,n=+b.dataset.n;
  if(a==='learn'){sub=n;render()}
  else if(a==='fold'){sub=n;render()}
  else if(a==='pos'){S.pos=n;render()}
  else if(a==='add'){addCapsule()}
  else if(a==='pick'){pickTeam()}
  else if(a==='score'){score(n,e.shiftKey?-1:1)}
});
addEventListener('keydown',e=>{
  const t=e.target;
  if(t&&t.matches&&t.matches('input,textarea,select')){if(e.key==='Enter'&&t.id==='draft'){e.preventDefault();addCapsule()}return}
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const k=e.key;
  if(k==='ArrowRight'||k==='PageDown'){e.preventDefault();go(1)}
  else if(k==='ArrowLeft'||k==='PageUp'){e.preventDefault();go(-1)}
  else if(k===' '||k==='Enter'){e.preventDefault();act()}
  else if(k==='Home'){S.i=0;sub=0;setTimer(0);render()}
  else if(k==='t'||k==='T'){toggleTimer()}
  else if(k==='r'||k==='R'){setTimer(SL[S.i].secs||0)}
  else if(k==='n'||k==='N'){$('#notes').classList.toggle('open')}
  else if(k==='f'||k==='F'){fs()}
  else if(/^Digit[1-4]$/.test(e.code)){score(+e.code.slice(5)-1,e.shiftKey?-1:1)}
});

/* boot */
S.i=Math.min(Math.max(0,S.i),SL.length-1);
fit();setTimer(SL[S.i].secs||0);render();
</script>
</body>
</html>
